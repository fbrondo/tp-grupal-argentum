[server]
port = 8080
max_players = 100
tick_rate_ms = 50          # main loop interval in milliseconds

[game]
inventory_size = 20        # max number of items a player can carry
clan_max_members = 16      # max players per clan (including founder)

[balance]
exp_limit_base = 1000      # Limit = exp_limit_base * Level^1.8
gold_max_base = 100         # GoldMax = gold_max_base * Level^1.1
gold_excess_factor = 0.5    # player can hold up to +50% above GoldMax

[npc]
spawn_interval_s = 30      # seconds between NPC spawn cycles
max_population = 200       # max NPC population on the map

[gameplay]
# El tiempo real que tarda un personaje lógicamente en moverse de un tile a otro (en milisegundos)
ms_per_step = 264

[animations]
# El tiempo que dura cada cuadro individual de la animación de caminata (en milisegundos)
# Como la animación de caminata base tiene 4 cuadros: 4 * 66ms = 264ms (perfectamente sincronizado)
frame_rate_walk_ms = 66

[window]
fullscreen = false
width = 960
height = 540