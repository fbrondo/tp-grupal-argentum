name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure
        run: |
          cmake -S . -B ./build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTALLER_CLIENT=OFF \
            -DTALLER_EDITOR=OFF \
            -DTALLER_SERVER=OFF \
            -DTALLER_TESTS=ON

      - name: Build
        run: cmake --build build/

      - name: Run tests
        run: ./build/taller_tests
