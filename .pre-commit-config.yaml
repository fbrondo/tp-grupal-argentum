---
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format 
    rev: v18.1.0
    hooks:
      - id: clang-format
        files: ^(.*[.]cpp|.*[.]h)$
        args: ["--style=file", "-i"]
  - repo: https://github.com/cpplint/cpplint
    rev: 1.6.0
    hooks:
      - id: cpplint
        files: ^(.*[.]cpp|.*[.]h)$
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: 9a9bbc00895bbdb7670231c2565d4f1309c42905  # SHA of v1.3.5
    hooks:
      - id: cppcheck
        files: ^(.*[.]cpp|.*[.]h)$
        # exclude: ^(tests|editor)/
        exclude: ^tests/
        args: ["--inline-suppr", "--library=qt", "--enable=all", "--suppress=missingIncludeSystem", "--suppress=missingInclude", "--suppress=unusedFunction", "--suppress=unmatchedSuppression", "--suppress=unusedStructMember", "--language=c++", "--std=c++20", "--error-exitcode=1"]
